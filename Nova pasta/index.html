<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Sistema Ágil V3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">
    <!-- Barra Lateral (Quadros e Cores) -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Meus Quadros</h2>
            <button onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul id="boardList" class="board-list"></ul>
        <button class="add-board-btn" onclick="createNewBoard()"><i class="fa-solid fa-plus"></i> Novo Quadro</button>
        
        <div class="sidebar-settings">
            <h3><i class="fa-solid fa-palette"></i> Fundo do Quadro</h3>
            <input type="color" id="boardBgColorPicker" onchange="changeBoardColor(this.value)">
        </div>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <h1 id="currentBoardTitle"><i class="fa-solid fa-layer-group"></i> Sistema Ágil</h1>
            </div>
            <div class="actions">
                <!-- Nova Barra de Pesquisa -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Pesquisar tarefas..." onkeyup="renderBoard()">
                </div>
                
                <button onclick="toggleDarkMode()" id="darkModeBtn" title="Modo Escuro"><i class="fa-solid fa-moon"></i></button>
                <button id="toggleViewBtn" onclick="toggleView()" title="Alternar Visão"><i class="fa-solid fa-list"></i></button>
                <button onclick="exportData()" title="Exportar Backup"><i class="fa-solid fa-download"></i></button>
                <label class="btn-import" title="Importar Backup">
                    <i class="fa-solid fa-upload"></i>
                    <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display: none;">
                </label>
            </div>
        </header>

        <main id="board" class="board">
            <!-- Listas geradas pelo JS -->
        </main>
    </div>

    <!-- Modal do Cartão -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <input type="text" id="modalTitle" class="modal-title-input" placeholder="Título da Tarefa">
            
            <div class="modal-grid">
                <div class="modal-main">
                    <h3>Descrição</h3>
                    <div class="tabs">
                        <button onclick="switchTab('edit')">Editar</button>
                        <button onclick="switchTab('preview')">Pré-visualizar</button>
                    </div>
                    <textarea id="modalDesc" rows="4" placeholder="Suporta Markdown..."></textarea>
                    <div id="modalPreview" class="markdown-body" style="display: none;"></div>
                    
                    <div class="checklist-section">
                        <div class="checklist-header">
                            <h3><i class="fa-regular fa-square-check"></i> Checklist</h3>
                            <span id="checklistProgressText">0%</span>
                        </div>
                        <div class="progress-bar"><div id="checklistProgress" class="progress-fill"></div></div>
                        <div class="checklist-input-group">
                            <input type="text" id="newChecklistItem" placeholder="Adicionar item..." onkeypress="handleChecklistEnter(event)">
                            <button onclick="addChecklistItem()">Add</button>
                        </div>
                        <div id="checklistItems" class="checklist-items"></div>
                    </div>

                    <div class="comments-section">
                        <h3><i class="fa-regular fa-comments"></i> Atividade e Comentários</h3>
                        <div class="comment-input-area">
                            <input type="text" id="newCommentInput" placeholder="Escreva um comentário..." onkeypress="if(event.key==='Enter') addComment()">
                            <button onclick="addComment()">Comentar</button>
                        </div>
                        <div id="commentsList" class="comments-list"></div>
                    </div>
                </div>
                
                <div class="modal-sidebar">
                    <h3>Propriedades</h3>
                    <label>Prazo:</label>
                    <input type="date" id="modalDueDate">
                    
                    <label>Etiqueta:</label>
                    <div class="tag-selector-group">
                        <select id="modalTag">
                            <!-- Preenchido pelo JS com etiquetas personalizadas -->
                        </select>
                        <button onclick="createNewTag()" title="Criar nova etiqueta"><i class="fa-solid fa-plus"></i></button>
                    </div>

                    <label>Responsável:</label>
                    <input type="text" id="modalMember" placeholder="Ex: João Silva">

                    <button class="save-btn" onclick="saveCard()">Salvar e Fechar</button>
                    <button class="delete-btn" onclick="deleteCard()">Excluir Cartão</button>
                </div>
            </div>
            <input type="hidden" id="modalCardId">
            <input type="hidden" id="modalListId">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
